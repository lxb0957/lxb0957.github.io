import sys
import asyncio

from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "web"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/web
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("web.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("web.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

<script>
/* [selfhost] 三件事：抢回被浏览器吃掉的按键、锁住键盘焦点、给触屏设备一个交代 */
(function () {
  // 1) 游戏用到的键会被浏览器默认行为吃掉（Tab 跳地址栏、Space 滚页面、F1 开帮助）。
  //    只 preventDefault，不 stopPropagation —— 一旦阻断冒泡，canvas 上的 pygame 就收不到了。
  var blocked = { Tab: 1, Space: 1, F1: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;   // 浏览器/系统级组合键一律不碰
    if (blocked[e.code] || blocked[e.key]) e.preventDefault();
  }, true);

  // 2) 焦点必须留在 canvas 上，否则 WASD 会被页面别处接走
  var cv = document.getElementById('canvas');
  function grab() {
    if (cv && document.activeElement !== cv) {
      try { cv.focus({ preventScroll: true }); } catch (x) { cv.focus(); }
    }
  }
  grab();
  document.addEventListener('click', grab);
  setInterval(grab, 1200);

  // 3) 触屏设备：别让人对着空白页猜为什么没反应
  var tp = document.getElementById('tp');
  var go = document.getElementById('tp-go');
  if (go) go.addEventListener('click', function () { tp.style.display = 'none'; grab(); });

  // 4) 装载页。pygbag 模板的 #status 写死 "Downloading..."、进度条几乎不动，
  //    用户既不知道总共要下多少，也不知道是在下载还是已经卡死。
  //    这里给真实字节数 + 阶段判断，顺便把等待时间换成有用的话。
  var ld = document.getElementById('ld');
  var ldBar = document.getElementById('ld-bar');
  var ldMeta = document.getElementById('ld-meta');
  var ldTip = document.getElementById('ld-tip');
  var statusEl = document.getElementById('status');

  var TIPS = [
    '按住 <b>Shift</b> 是潜行，脚步没声音。松开就是跑，跑起来整条走廊都听得见。',
    '按 <b>F1</b> 能看见每个哨兵的视野锥和听觉圈，不用猜他在看哪。',
    '被看见了先别跑。找掩体蹲下把视线断掉，他会自己走回去搜。',
    '扔石头能把人引开，但他们会记住石头落在哪，回来时比刚才更警觉。',
    '体力见底就站着别动，几秒回满。冲刺是用来脱身的，不是用来赶路的。',
    '按键没反应，先在画面里点一下 —— 键盘焦点要给到游戏。'
  ];
  var tipIndex = 0;
  if (ldTip) {
    ldTip.innerHTML = TIPS[0];
    setInterval(function () {
      tipIndex = (tipIndex + 1) % TIPS.length;
      ldTip.style.opacity = 0;
      setTimeout(function () { ldTip.innerHTML = TIPS[tipIndex]; ldTip.style.opacity = 1; }, 260);
    }, 4200);
  }

  var TOTAL = 12 * 1048576;        // 线上 gzip 后实测约 11.3 MB，留余量免得进度条提前满了
  var sum = 0, t0 = performance.now(), lastSum = -1, stillSince = performance.now();
  var dismissed = false;

  function leave() {
    if (dismissed || !ld) return;
    dismissed = true;
    ld.style.opacity = 0;
    setTimeout(function () { if (ld.parentNode) ld.remove(); }, 480);
  }

  function paint() {
    var now = performance.now();
    if (sum !== lastSum) { lastSum = sum; stillSince = now; }
    var s = Math.round((now - t0) / 1000);
    var idle = Math.round((now - stillSince) / 1000);
    var mb = sum / 1048576;
    var pct = Math.min(100, Math.round(sum / TOTAL * 100));
    var msg;

    if (ldBar) ldBar.style.width = pct + '%';
    if (mb < 0.05) {
      // 一个字节都没动：要么还在建连，要么这些文件已被落地页预取好、直接走缓存
      msg = idle > 4 ? '运行时已在缓存里，正在编译 (' + s + 's)'
                     : '正在连接… (' + s + 's)';
    } else if (pct >= 100) {
      // 没开 gzip 的服务器（本地预览）会超过预估总量，别显示成 120%
      msg = '已下 ' + mb.toFixed(1) + ' MB，收尾中 (' + s + 's)';
    } else if (idle > 5) {
      msg = '已下 ' + mb.toFixed(1) + ' MB，还在等 (' + s + 's)';
    } else {
      msg = '已下 ' + mb.toFixed(1) + ' MB / 约 11 MB · ' + pct + '% · ' + s + 's';
    }
    if (ldMeta) ldMeta.textContent = msg;
    if (statusEl) statusEl.textContent = msg;     // 装载页万一没挂上，还有这行兜底
  }

  // 画面真的出来了才退场：pygbag 的 canvas 一开始就存在，但 width 是 1
  var watch = setInterval(function () {
    var c = document.querySelector('canvas');
    if (c && c.width > 1) { clearInterval(watch); leave(); }
  }, 400);
  setTimeout(function () { clearInterval(watch); leave(); }, 120000);   // 兜底，别永久挡住

  if (window.PerformanceObserver) {
    try {
      new PerformanceObserver(function (list) {
        list.getEntries().forEach(function (e) {
          sum += e.transferSize || e.encodedBodySize || 0;
        });
        paint();
      }).observe({ type: 'resource', buffered: true });
    } catch (e) {}
  }
  setInterval(paint, 300);
})();
</script>
